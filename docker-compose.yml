version: "3.9"

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: patients_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-patients}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - patients_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - patients_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-patients}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Aplicación Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 24.11.0
    container_name: patients_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-patients}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - patients_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  patients_network:
    driver: bridge

volumes:
  patients_data:
    driver: local
